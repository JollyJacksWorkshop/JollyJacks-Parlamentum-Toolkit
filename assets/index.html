/* V1.1: primary simulation controls and always-visible operating profitability. */
.chain-quick{margin:13px 0 11px;padding:14px 16px!important;border:1px solid rgba(216,163,91,.4)!important;}
.chain-quick-controls{display:flex;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:14px;}
.chain-quick-controls>div{min-width:160px;flex:1;}
.chain-quick-controls .quick-note{flex:2;min-width:230px;align-self:center;color:#c0a8ab;font-size:12px;line-height:1.45;}
.shift-buttons{display:flex;gap:5px;flex-wrap:nowrap;align-items:center;}
.shift-number{width:84px!important;min-width:84px!important;}
.fx-number{max-width:185px;}
.quick-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
.quick-metrics .result-kpi{padding:12px!important;}
.quick-metrics strong{font-size:clamp(14px,1.4vw,21px)!important;}
.quick-alert{margin-top:9px;padding:8px 11px;background:rgba(163,87,51,.14);border:1px solid rgba(207,143,83,.38);border-radius:9px;color:#ecc9a1;font-size:12px;display:flex;align-items:center;gap:8px;}
.quick-note{font-size:12px;color:#b6a5ad;}
.simple-prices{margin-top:12px;padding:11px;background:rgba(241,196,126,.06);border-radius:9px;border:1px solid rgba(241,196,126,.15);}
.simple-prices h4{margin:0 0 10px;font-size:13px;}
.simple-prices .field{margin:4px 0 10px;}

(function(root){'use strict';
const EPS=1e-8;
const RES=['Raw Grain','Raw Iron','Raw Oil','Raw Cotton','Timber','Coal','Raw Copper'];
const MULT=[1,.8,.65,.5,.4], COMBAT=[1,1.5,2,2.5,3];
const FOOD=[10,20,35,60,100],TICKET=[25,50,90,150,250];
const SHIPS=[[2,1,1],[4,2,2],[6,4,4],[12,6,6],[20,10,10]];
const clamp=(x,min=0,max=1e10)=>{const v=Number(x);return Number.isFinite(v)?Math.min(max,Math.max(min,v)):min};
const has=x=>x!==undefined&&x!==null&&String(x).trim()!=='';
const take=(o,k,d=0)=>has(o?.[k])?clamp(o[k],-1e7,1e10):d;
const floor=x=>Math.floor(x+EPS);
const currencyTax=(amount,pct)=>{if(amount<=0||pct<=0)return 0;return Math.min(amount,Math.max(.01,floor(amount*pct)/100));};
const productKey=c=>c.category==='Resource Plant'?c.product:((c.category==='Factory'||c.category==='Heavy Industry')?c.product+' '+c.tier:c.product);
const inputRecipe=c=>{
 const p=c?.product||'',t=Math.max(0,Math.min(4,(parseInt((c.tier||'T1').replace('T',''),10)||1)-1));
 if(c?.category==='Resource Plant')return {};
 if(c?.category==='Factory')return p==='Food'?{'Raw Grain':FOOD[t]}:p==='Weapon'?{'Raw Iron':FOOD[t]}:p==='Ticket'?{'Raw Oil':TICKET[t]}:{};
 if(c?.category==='Light Industry')return p==='Construction Materials'?{'Raw Iron':5,Timber:5}:p==='Fuel'?{Coal:5,'Raw Oil':5}:p==='Electronics'?{'Raw Copper':5,'Raw Cotton':5}:{};
 if(c?.category==='Heavy Industry'&&p==='Ships')return {'Construction Materials':SHIPS[t][0],Fuel:SHIPS[t][1],Electronics:SHIPS[t][2]};

};

const app=document.getElementById('app'),main=document.getElementById('main'),modalHost=document.getElementById('modal-host');
const S=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);

const blankProfile=()=>({name:'',level:'',economy:'',education:'',war:'',homeCountryId:'',avatar:'',notes:''});

const makeCountry=()=>({id:id(),name:'',flag:'',productionTax:'',incomeTax:'',importTax:'',exportTax:'',notaryTax:'',ideology:'',usdPerUnit:'',capitalLost:'',policies:'',notes:''});
const makeRegion=()=>({id:id(),name:'',countryId:'',health:'',education:'',military:'',industry:'',electricity:'',bonuses:Object.fromEntries(RESOURCES.map(x=>[x,''])),pioneer:'',crownRank:'',activePlayers:'',capacityPercent:'',notes:''});

let state=initial();try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.schema===3&&['countries','regions','workers','companies','chains','templates'].every(k=>Array.isArray(d[k])))state={...initial(),...d,profile:{...blankProfile(),...d.profile}}}catch(e){}
let calculatorTab='production',calculatorSection='estimate',page='dashboard',modal=null,profileDraft=null,activeChainId=null,selectedNode=null,pendingOut=null,pickerOpen=false,pickerSearch='',pickerCategory='',editorTab='details',listSearch='',chainSearch='',templateSearch='',drag=null;
function toast(msg,bad=false){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(bad?' bad':'');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.add('hide'),3600)}
const IS_WINDOWS_APP=location.protocol==='http:'&&location.hostname==='127.0.0.1';
let saving=false,saveDirty=false;
async function saveServer(){if(saving)return;saving=true;while(saveDirty){saveDirty=false;try{const response=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});if(!response.ok)throw Error('HTTP '+response.status);document.getElementById('save-status').textContent='Saved to your computer';}catch(e){document.getElementById('save-status').textContent='Save failed — export a backup';toast('Windows settings could not be saved. Export a backup.',true);}}saving=false}
function persist(){if(IS_WINDOWS_APP){saveDirty=true;saveServer();return true}try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('save-status').textContent='Saved on this device';return true}catch(e){document.getElementById('save-status').textContent='Storage issue — export backup';toast('Browser storage may be full. Export a backup from Settings.',true);return false}}
function getRef(type,k){return state[type].find(o=>o.id===k)}
function getCountry(co){return co?.regionId?getRef('regions',co.regionId)?.countryId||'':co?.directCountryId||''}
function countryLabel(key){return key?getRef('countries',key)?.name||'Unknown / deleted country':'Unassigned'}
function regionLabel(key){return key?getRef('regions',key)?.name||'Unknown / deleted region':'Unassigned'}
function fullType(c){return [c.category,c.product,c.tier].filter(Boolean).join(' · ')||'Type not configured'}
function imgBox(data,kind='building',size=62){return typeof data==='string'&&data.trim()?`<img class="itemlogo" style="width:${size}px;height:${size}px" src="${S(data)}" alt="">`:`<div class="itemlogo placeholder" style="width:${size}px;height:${size}px">${ico(kind,size>70?'xl':'lg')}</div>`}
function formattedDate(n){try{return new Date(n).toLocaleString()}catch{return 'Not recorded'}}
function navigate(target){if(profileDraft&&target!=='profile'&&!confirm('Discard unsaved profile edits?'))return;profileDraft=null;page=target;activeChainId=null;selectedNode=null;pendingOut=null;pickerOpen=false;listSearch='';render();window.scrollTo(0,0)}
function renderNav(){document.getElementById('navigation').innerHTML=nav.map(([key,icon,label],i)=>`${[1,4,6,8].includes(i)?'<div class="nav-h">'+({1:'Your account',4:'Operations',6:'Planning',8:'Toolkit'}[i])+'</div>':''}<button class="nav-btn ${page===key?'active':''}" data-nav="${key}">${ico(icon)}<span>${label}</span></button>`).join('');document.getElementById('breadcrumb').textContent=nav.find(n=>n[0]===page)?.[2]||'Dashboard'}
function render(){renderNav();({dashboard:renderDashboard,profile:renderProfile,countries:()=>renderCollection('countries'),regions:()=>renderCollection('regions'),workers:()=>renderCollection('workers'),companies:()=>renderCollection('companies'),chains:()=>activeChainId?renderWorkspace():renderListChains(false),templates:()=>renderListChains(true),calculators:renderCalculators,settings:renderSettings})[page]?.()}
function empty(icon,title,body,cta='',action=''){return `<div class="empty">${ico(icon)}<h3>${S(title)}</h3><p>${S(body)}</p>${cta?`<button class="btn" data-act="${action}">${ico('plus')}${S(cta)}</button>`:''}</div>`}
function pagehead(title,sub,buttons=''){return `<div class="pagehead"><div><h1>${S(title)}</h1><p>${S(sub)}</p></div><div class="buttons">${buttons}</div></div>`}
function metric(label,n,icon){return `<div class="card metric">${ico(icon)}<small>${S(label)}</small><strong>${n}</strong></div>`}
function renderDashboard(){main.innerHTML=`<section class="hero"><div class="hero-copy"><span class="chip">FULL EDITION · V1</span><h1>Build your empire.<br>From the ground up.</h1><p>A blank, private workspace for your Parlamentum profiles, businesses, regions, workers, and custom supply chains. Real-world estimates from your entered data. No live game connection.</p><div class="buttons" style="margin-top:20px"><button class="btn" data-act="create-company">${ico('plus')} Create first company</button><button class="btn ghost" data-act="new-chain">${ico('workflow')} New supply chain</button></div></div><img src="${BRAND}" alt="JollyJack's Toolkit logo"></section><div class="grid four">${metric('Countries',state.countries.length,'globe')}${metric('Regions',state.regions.length,'pin')}${metric('Companies',state.companies.length,'building')}${metric('Supply Chains',state.chains.length,'workflow')}</div><div class="section-title"><h2>Your workspace</h2><span class="chip dim">${state.workers.length} saved workers · ${state.templates.length} templates</span></div><div class="grid">${[['profile','user','My Profile','Enter your own stats, photo and optional home country.'],['countries','globe','Countries','Set up country records, policies and tax fields.'],['regions','pin','Regions','Manage regional deposits, building indexes and dynamic control.'],['companies','building','My Companies','Save custom businesses, logos, levels and workers.'],['chains','workflow','Supply Chains','Connect saved company blocks; save named workspaces.'],['templates','folder','Templates','Reuse and share your supply chain layouts.']].map(x=>`<button class="card tile" data-nav="${x[0]}" style="text-align:left;color:inherit">${ico(x[1])}<h3>${x[2]}</h3><p>${x[3]}</p><span style="color:var(--gold);font-size:12px">Open section →</span></button>`).join('')}</div><div class="section-title"><h2>Start at zero</h2></div><div class="notebox">A new user begins with zero countries, regions, companies, employees, chains, and templates. Unknown player stats, taxes, levels, and bonuses are blank—not assumed to be zero. Your information stays on your computer unless you export it.</div>`}
function field(label,path,obj,placeholder='',opts={}){const val=getPath(obj,path)??'';const attr=`data-field="${S(path)}" data-scope="${opts.scope||'modal'}"`;
const cls=`<label class="field-label">${S(label)}</label>`;
if(opts.select){const options=[{value:'',label:opts.empty||'Not selected'},...opts.select];return `<div class="formgroup ${opts.wide?'wide':''}">${cls}<select class="field" ${attr}>${options.map(o=>`<option value="${S(o.value)}" ${String(val)===String(o.value)?'selected':''}>${S(o.label)}</option>`).join('')}</select></div>`}
if(opts.textarea)return `<div class="formgroup ${opts.wide?'wide':''}">${cls}<textarea class="field" ${attr} placeholder="${S(placeholder)}">${S(val)}</textarea></div>`;
return `<div class="formgroup ${opts.wide?'wide':''}">${cls}<input class="field" ${attr} ${opts.numeric?'inputmode="decimal" type="number" step="any"':''} value="${S(val)}" placeholder="${S(placeholder)}"></div>`}
function getPath(obj,path){return path.split('.').reduce((v,k)=>v?.[k],obj)}
function setPath(obj,path,value){const parts=path.split('.');let cur=obj;for(let i=0;i<parts.length-1;i++){if(cur[parts[i]]==null)cur[parts[i]]={};cur=cur[parts[i]]}cur[parts.at(-1)]=value}
function countryOptions(){return state.countries.map(c=>({value:c.id,label:c.name||'(Unnamed country)'}))}
function regionOptions(){return state.regions.map(r=>({value:r.id,label:(r.name||'(Unnamed region)')+' — '+countryLabel(r.countryId)}))}
function renderProfile(){const edit=profileDraft!==null,p=edit?profileDraft:state.profile;const input=edit;main.innerHTML=pagehead('My Profile','Your player information is optional. Nothing is prefilled from another player.',edit?`<button class="btn ghost" data-act="discard-profile">${ico('x')} Discard changes</button><button class="btn" data-act="save-profile">${ico('save')} Save profile</button>`:`<button class="btn" data-act="edit-profile">${ico('edit')} Edit Profile</button>`)+`<div class="grid two"><div class="card pad"><div class="logoedit" style="margin-bottom:19px">${imgBox(p.avatar,'user',100)}<div><h2>${S(p.name||'No player name saved')}</h2><p>${edit?'Edit your public game identity. Changes are not saved until you choose Save.':'Character information is not configured.'}</p>${input?`<div class="buttons" style="margin-top:10px"><label class="btn ghost sm" for="profile-upload">${ico('upload')} Upload avatar</label><input type="file" id="profile-upload" accept="image/png,image/jpeg,image/webp" hidden><button class="btn subtle sm" data-act="clear-profile-photo">Remove</button></div>`:''}</div></div><div class="formgrid">${field('Player name','name',p,'Not set',{scope:'profile'})}${field('Character level','level',p,'Unknown',{scope:'profile',numeric:true})}${field('Economy skill','economy',p,'Unknown',{scope:'profile',numeric:true})}${field('Education skill','education',p,'Unknown',{scope:'profile',numeric:true})}${field('War / Strength skill','war',p,'Unknown',{scope:'profile',numeric:true})}${field('Home country','homeCountryId',p,'',{scope:'profile',select:countryOptions(),empty:'No home country selected'})}${field('Notes','notes',p,'Optional private notes',{scope:'profile',wide:true,textarea:true})}</div></div><div class="card pad"><h2>Profile behavior</h2><p style="margin-top:9px">Your saved profile can be selected for owner-operated company shifts later. It is not automatically assigned to any company.</p><div class="hr"></div><div class="notebox">${edit?'Draft mode: change values freely, then Save or Discard. Navigating away asks before discarding.':'Viewing saved values. Select Edit Profile to change them. Blank fields mean unknown or not entered.'}</div><div class="hr"></div><h3>Data privacy</h3><p style="margin-top:8px">The toolkit stores data in this browser. No account creation, online login, or external network connection is required.</p></div></div>`;
main.querySelectorAll('[data-scope="profile"]').forEach(el=>el.disabled=!edit)}
function typeOptions(){return Object.keys(PRODUCTS).map(x=>({value:x,label:x}))}
function recipeText(c){if(!c.category||!c.product)return 'Select a category and product to see its expected material inputs.';if(c.category==='Resource Plant')return 'Raw material extraction · no material inputs.';return 'Expected inputs: '+(RECIPES[c.product]||'Not specified')+(c.tier?' · '+c.tier:'')+'.'}
function productsFor(c){return (PRODUCTS[c.category]||[]).map(x=>({value:x,label:x}))}
function collectionTitle(key){return ({countries:['Countries','Create country profiles with editable taxes and policies.','globe','country'],regions:['Regions','Assign controlling countries and edit local buildings and resource deposits.','pin','region'],workers:['Workers','Optional reusable worker profiles; companies can also have their own independent workers.','users','worker'],companies:['My Companies','Save company settings, link regions, and manage independent employees.','building','company']})[key]}

function searchable(key,a){if(key==='companies')return [a.name,a.category,a.product,a.tier,regionLabel(a.regionId),countryLabel(getCountry(a))].join(' ');if(key==='regions')return a.name+' '+countryLabel(a.countryId);return a.name+' '+(key==='workers'?a.notes:a.policies||'')}
function renderCollectionItems(key,list,icon,single){if(!list.length)return empty(icon,`No ${key} ${listSearch?'match your search':'yet'}`,listSearch?'Try a different search.':`Add your first ${single} when you're ready.`,listSearch?'':`Add ${single}`,listSearch?'':`create-${single}`);
return `<div class="grid two">${list.map(a=>`<div class="card itemcard">${imgBox(a.logo||a.flag||' ',icon)}<div class="iteminfo"><h3>${S(a.name||'(Unnamed '+single+')')}</h3><p>${key==='countries'?`${state.regions.filter(r=>r.countryId===a.id).length} linked regions · Taxes: ${['productionTax','incomeTax','exportTax'].filter(t=>a[t]!=='').length}/3 entered`:key==='regions'?`Controlled by ${S(countryLabel(a.countryId))} · ${state.companies.filter(c=>c.regionId===a.id).length} companies`:key==='workers'?`Economy ${asNum(a.economy)} · Education ${asNum(a.education)} · Level ${asNum(a.level)}`:`${S(fullType(a))} · Level ${asNum(a.level)}`}</p><div class="meta">${key==='companies'?`<span class="chip dim">${S(regionLabel(a.regionId))}</span><span class="chip dim">${(a.workerIds?.length||0)+(a.privateWorkers?.length||0)} workers</span>`:key==='regions'?`<span class="chip dim">${S(countryLabel(a.countryId))}</span>`:''}</div><div class="buttons"><button class="btn ghost sm" data-edit="${key}:${S(a.id)}">${ico('edit')} Edit</button><button class="btn subtle sm" data-duplicate="${key}:${S(a.id)}">${ico('copy')} Duplicate</button><button class="btn subtle sm" data-delete="${key}:${S(a.id)}">${ico('trash')}</button></div></div></div>`).join('')}</div>`}
function editRecord(key,recordId){const item=recordId?getRef(key,recordId):null;const creator=({countries:makeCountry,regions:makeRegion,workers:makeWorker,companies:makeCompany})[key];modal={type:key,originalId:recordId||null,draft:item?structuredClone(item):creator()};renderModal()}
function modalTitle(){return ({countries:'Country',regions:'Region',workers:'Worker',companies:'Company'})[modal.type]}
function renderModal(){if(!modal){modalHost.innerHTML='';return}const x=modal.draft,kind=modal.type;let body='';
if(kind==='countries'){body=`<div class="logoedit">${imgBox(x.flag,'globe',84)}<div><h3>Country flag (optional)</h3><p>Upload a custom flag, or leave it blank.</p><div class="buttons" style="margin-top:9px"><label class="btn ghost sm" for="modal-image">${ico('upload')} Upload flag</label><button class="btn subtle sm" data-act="clear-image">Remove</button></div></div></div><div class="formgrid">${field('Country name *','name',x,'e.g. Free State of West Virginia',{wide:true})}</div><div class="subcard"><div class="subhead"><h3>Country tax fields (%)</h3><span class="chip dim">Blank = unknown</span></div><div class="formgrid">${field('Production tax','productionTax',x,'Not set',{numeric:true})}${field('Income tax','incomeTax',x,'Not set',{numeric:true})}${field('Import tax','importTax',x,'Not set',{numeric:true})}${field('Export tax','exportTax',x,'Not set',{numeric:true})}${field('Notary tax / fee (game units)','notaryTax',x,'Not set',{numeric:true})}</div></div><div class="formgrid">${field('Country ideology','ideology',x,'',{select:[{value:'None',label:'None / other'},{value:'Socialism',label:'Socialism (+15% production)'},{value:'Nationalism',label:'Nationalism (+10% damage)'},{value:'Conservatism',label:'Conservatism'},{value:'Liberalism',label:'Liberalism'}],empty:'Unknown'})}${field('Value of 1 local currency unit (USD)','usdPerUnit',x,'Unknown',{numeric:true})}${field('Capital recently lost?','capitalLost',x,'',{select:[{value:'no',label:'No'},{value:'yes',label:'Yes (−10% output)'}],empty:'Unknown'})}${field('Policies / diplomacy','policies',x,'Optional country policies or cooperation notes',{wide:true,textarea:true})}${field('Notes','notes',x,'Optional notes',{wide:true,textarea:true})}</div>`}
if(kind==='regions'){body=`<div class="formgrid">${field('Region name *','name',x,'Name of region')}${field('Controlling country','countryId',x,'',{select:countryOptions(),empty:'Unassigned / unknown'})}</div><div class="subcard"><div class="subhead"><h3>Buildings / region indexes</h3><span class="chip dim">No assumed levels</span></div><div class="formgrid">${BUILDINGS.map(t=>field(t+' index / level',t.toLowerCase(),x,'Unknown',{numeric:true})).join('')}</div></div><div class="subcard"><div class="subhead"><h3>Resource deposit bonuses (%)</h3><span class="chip dim">Per resource</span></div><div class="formgrid">${RESOURCES.map(t=>field(t+' bonus',`bonuses.${t}`,x,'Unknown',{numeric:true})).join('')}${field('Pioneer / region-specific modifier (%)','pioneer',x,'Unknown',{numeric:true})}</div></div><div class="formgrid">${field('Crown rank','crownRank',x,'',{select:[{value:'none',label:'None'},{value:'1',label:'1st city'},{value:'2',label:'2nd city'},{value:'3',label:'3rd city'}],empty:'Unknown'})}${field('Active players (24h)','activePlayers',x,'Unknown',{numeric:true})}${field('Capacity remaining (%)','capacityPercent',x,'Unknown',{numeric:true})}${field('Notes','notes',x,'Optional region notes',{wide:true,textarea:true})}</div><div class="notebox">A region's controlling country can be changed at any time. Companies linked to that region will automatically use the updated controlling country.</div>`}
if(kind==='workers'){body=`<div class="formgrid">${workerFields(x)}</div><div class="notebox">These reusable worker records are optional. A company can instead store private independent workers that do not appear in the Workers library.</div>`}
if(kind==='companies'){const linkedReg=x.regionId?getRef('regions',x.regionId):null;const workerIds=x.workerIds||[];body=`<div class="logoedit">${imgBox(x.logo,'building',84)}<div><h3>Company logo (optional)</h3><p>No built-in company logos are assigned. Upload, replace, or remove your own.</p><div class="buttons" style="margin-top:9px"><label class="btn ghost sm" for="modal-image">${ico('upload')} Upload company logo</label><button class="btn subtle sm" data-act="clear-image">Remove</button></div></div></div><div class="formgrid">${field('Company name *','name',x,'Company name',{wide:true})}${field('Company category','category',x,'',{select:typeOptions(),empty:'Select company category'})}${field('Product','product',x,'',{select:productsFor(x),empty:x.category?'Select product':'Choose category first'})}${['Factory','Heavy Industry'].includes(x.category)?field('Tier','tier',x,'',{select:TIERS.map(t=>({label:t,value:t})),empty:'Select tier'}):''}${field('Company level','level',x,'Unknown',{numeric:true})}</div><div class="notebox" id="recipe-hint">${S(recipeText(x))}</div><div class="subcard"><div class="subhead"><h3>Company location</h3><span class="chip dim">Inherited where possible</span></div><div class="formgrid">${field('Region','regionId',x,'',{select:regionOptions(),empty:'No saved region assigned'})}${field('Country (when region unassigned)','directCountryId',x,'',{select:countryOptions(),empty:'No fallback country selected'})}</div><p style="margin-top:10px">${linkedReg?`Region controller: <strong style="color:var(--gold)">${S(countryLabel(linkedReg.countryId))}</strong>. Region ownership overrides the company’s fallback country.`:'Choose a saved region to inherit its current controlling country, building indexes, and applicable deposits.'}</p></div><div class="subcard"><div class="subhead"><h3>Workers</h3><span class="chip dim">Optional</span></div><p style="margin-bottom:10px">Assign actual players to this company. Shift counts and work energy are selected automatically in the Supply Chain Builder; they are not saved on workers.</p><button class="btn ghost sm" data-act="add-owner-worker" type="button">${ico('user')} Add my player profile (unpaid owner work)</button>${state.workers.length?`<div style="max-height:175px;overflow:auto">${state.workers.map(w=>`<label class="checkline"><input type="checkbox" data-worker-link="${S(w.id)}" ${workerIds.includes(w.id)?'checked':''}><span>${S(w.name||'(Unnamed worker)')} <small>· Economy ${asNum(w.economy)}, Level ${asNum(w.level)}</small></span></label>`).join('')}</div>`:'<p class="mutedline">No worker-library profiles saved yet. You can add private workers below.</p>'}<div class="hr"></div><div class="subhead"><h3>Independent company workers</h3><button class="btn subtle sm" data-act="add-private-worker">${ico('plus')} Add worker</button></div><div id="private-worker-list">${renderPrivateWorkers(x)}</div></div><div class="formgrid">${field('Starting output stock (units)','initialStock',x,'Unknown',{numeric:true})}${field('Stored manufacturing inputs','inputStock',x,'e.g. Raw Iron:200; Timber:100',{wide:true,textarea:true})}${field('Production additive bonus (%)','extraIndustry',x,'Unknown',{numeric:true})}${field('Optional default sale price','salePrice',x,'Unknown',{numeric:true})}${field('Default sale venue','saleMarket',x,'',{select:[{value:'global',label:'Global (gold)'},{value:'local',label:'Local (country currency)'}],empty:'Not selected'})}${field('Notes','notes',x,'Optional business notes',{wide:true,textarea:true})}</div>`}
modalHost.innerHTML=`<div class="modal-cover" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-label="${modal.originalId?'Edit':'Create'} ${modalTitle()}"><div class="modal-head"><div><h2>${modal.originalId?'Edit':'Create'} ${modalTitle()}</h2><p>Changes are only saved when you click Save.</p></div><button class="btn subtle square" data-act="close-modal" aria-label="Close">${ico('x')}</button></div><div class="modal-body">${body}</div><div class="modal-footer"><span class="mutedline">${modal.originalId?'Editing saved profile':'New profile'}</span><div class="buttons"><button class="btn ghost" data-act="close-modal">Discard</button><button class="btn" data-act="save-modal">${ico('save')} Save ${modalTitle()}</button></div></div></div></div>`;
if(['companies','countries'].includes(kind)){const wrap=modalHost.querySelector('.logoedit');wrap.insertAdjacentHTML('beforeend','<input type="file" id="modal-image" accept="image/png,image/jpeg,image/webp" hidden>')}
}
function workerFields(w){return field('Worker name *','name',w,'Name of employee',{wide:true})+field('Economy skill','economy',w,'Unknown',{numeric:true})+field('Education skill','education',w,'Unknown',{numeric:true})+field('War skill','war',w,'Unknown',{numeric:true})+field('Character level','level',w,'Unknown',{numeric:true})+field('Mobile Workshop bonus (%)','mobileWorkshop',w,'Unknown',{numeric:true})+field('Base wage (local / 10 energy)','wage',w,'Unknown',{numeric:true})+field('Wage skill multiplier (0–50)','bonus',w,'Unknown',{numeric:true})+`<div class="formgroup wide"><label class="checkline"><input type="checkbox" data-worker-owner ${w.owner?'checked':''}> Owner-operated (no employee wage expense)</label></div>`+field('Notes','notes',w,'Optional employee notes',{wide:true,textarea:true})}
function renderPrivateWorkers(co){if(!(co.privateWorkers||[]).length)return '<p class="mutedline">No company-specific workers added.</p>';return co.privateWorkers.map((w,i)=>`<div class="subcard" style="margin:10px 0"><div class="subhead"><h3>Private worker ${i+1}</h3><button class="btn subtle sm" data-remove-private="${i}">${ico('trash')} Remove</button></div><div class="formgrid">${field('Name','name',w,'Worker name',{scope:'private',wide:true})}${field('Economy','economy',w,'Unknown',{scope:'private',numeric:true})}${field('Education','education',w,'Unknown',{scope:'private',numeric:true})}${field('Level','level',w,'Unknown',{scope:'private',numeric:true})}${field('Base wage (local / 10 energy)','wage',w,'Unknown',{scope:'private',numeric:true})}${field('Wage skill multiplier (0–50)','bonus',w,'Unknown',{scope:'private',numeric:true})}<div class="formgroup wide"><label class="checkline"><input type="checkbox" data-private-owner="${i}" ${w.owner?'checked':''}> Owner-operated</label></div></div></div>`.replaceAll('data-scope="private"',`data-scope="private" data-private-index="${i}"`)).join('')}
function saveModal(){if(!modal)return;const {type,originalId,draft}=modal;if(!String(draft.name||'').trim()){toast('Please enter a name before saving.',true);return}if(type==='companies'){if(!draft.category||!draft.product){toast('Select a company category and product.',true);return}if(['Factory','Heavy Industry'].includes(draft.category)&&!draft.tier){toast('Select a product tier.',true);return}if(!['Factory','Heavy Industry'].includes(draft.category))draft.tier='';if(!PRODUCTS[draft.category].includes(draft.product)){toast('That product does not match its company category.',true);return}}draft.name=draft.name.trim();if(originalId){const i=state[type].findIndex(x=>x.id===originalId);if(i<0){toast('Saved record could not be found.',true);return}state[type][i]=structuredClone(draft)}else state[type].push(structuredClone(draft));const label=modalTitle();modal=null;modalHost.innerHTML='';persist();render();toast(`${label} saved successfully.`)}
function discardModal(){if(!modal)return;modal=null;modalHost.innerHTML=''}
function deleteRecord(type,rid){const x=getRef(type,rid);if(!x)return;let impact='';if(type==='countries')impact=`${state.regions.filter(r=>r.countryId===rid).length} regions currently reference this country; their controlling country will be cleared.`;if(type==='regions')impact=`${state.companies.filter(c=>c.regionId===rid).length} companies will have their region unassigned.`;if(type==='workers')impact=`${state.companies.filter(c=>c.workerIds?.includes(rid)).length} companies will lose the linked worker assignment.`;if(type==='companies')impact='Existing supply-chain nodes will keep an independent snapshot of this company.';
if(!confirm(`Delete "${x.name}"?\n${impact}`))return;
if(type==='countries'){state.regions.forEach(r=>{if(r.countryId===rid)r.countryId=''});state.companies.forEach(c=>{if(c.directCountryId===rid)c.directCountryId=''});if(state.profile.homeCountryId===rid)state.profile.homeCountryId=''}
if(type==='regions')state.companies.forEach(c=>{if(c.regionId===rid)c.regionId=''})
if(type==='workers')state.companies.forEach(c=>{c.workerIds=(c.workerIds||[]).filter(x=>x!==rid)})
if(type==='companies'){for(const c of [...state.chains,...state.templates])for(const nd of c.nodes)if(nd.companyId===rid&&nd.kind==='company'){nd.linked=false;nd.snapshot=structuredClone(x)}}
state[type]=state[type].filter(z=>z.id!==rid);persist();render();toast(`${type.slice(0,-1)} deleted.`)}
async function importPicture(file,where){if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>8*1024*1024){toast('Please select a PNG, JPG, or WebP under 8 MB.',true);return}
try{const url=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const can=document.createElement('canvas');const max=280,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));can.width=Math.round(img.naturalWidth*scale);can.height=Math.round(img.naturalHeight*scale);const ctx=can.getContext('2d');ctx.drawImage(img,0,0,can.width,can.height);const png=can.toDataURL('image/webp',.78);if(where==='profile'){if(profileDraft){profileDraft.avatar=png;renderProfile()}}else if(modal){modal.draft[modal.type==='countries'?'flag':'logo']=png;renderModal()}}catch(e){toast('Could not open this image.',true)}}
function renderCalculatorsOriginal(){main.innerHTML=pagehead('Calculator Library','Production, finance, trading, combat and planning calculators.')+`<div class="preview-only">${ico('info')} No calculations run in this prototype. These are planned modules for later versions.</div><div class="grid" style="margin-top:16px">${[['pickaxe','Resource & Industry Production','Mines, factories, light industry, heavy industry'],['coins','Worker Wages & Unit Costs','Employee profiles, energy, wages, taxes'],['workflow','Supply Chain Economics','Material flow, throughput, profitability, bottlenecks'],['globe','Markets & Trade','Local/global sales, taxes, exchange rates'],['calc','Investment & Forecasting','Capital cost, upgrade ROI, projections'],['shield','Military & Equipment','Combat damage, equipment tiers, consumption']].map(([ic,name,desc])=>`<div class="card tile">${ico(ic)}<h3>${name}</h3><p>${desc}</p><span class="chip dim">Coming later</span></div>`).join('')}</div>`}
function renderListChains(isTemplate){const key=isTemplate?'templates':'chains';const items=state[key];const label=isTemplate?'Templates':'Supply Chains';const query=isTemplate?templateSearch:chainSearch;const buttons=isTemplate?`<button class="btn ghost" data-act="import-template">${ico('upload')} Import Template</button>`:`<button class="btn ghost" data-act="import-chain">${ico('upload')} Import Chain</button><button class="btn" data-act="new-chain">${ico('plus')} New Supply Chain</button>`;
main.innerHTML=pagehead(label,isTemplate?'Reusable saved layouts. Load one to create a separate new supply chain.':'Name, save, reopen, duplicate, import, and export chain workspaces.',buttons)+`<div class="toolbar"><div class="search">${ico('search')}<input class="field" id="chain-search" value="${S(query)}" placeholder="Search ${isTemplate?'templates':'supply chains'}..."></div><span class="chip dim">${items.length} saved</span></div><div id="chain-results">${chainResults(isTemplate,query)}</div>`}
function chainResults(isTemplate,query){const key=isTemplate?'templates':'chains';const list=state[key].filter(c=>c.name.toLowerCase().includes(String(query||'').toLowerCase()));if(!list.length)return empty('workflow',isTemplate?'No templates found':'No supply chains found',query?'Try a different search.':isTemplate?'Save a supply chain as a reusable template to see it here.':'Create a named workspace, then add your saved companies as blocks.',isTemplate?'':'Create supply chain',isTemplate?'':'new-chain');return `<div class="listcards">${list.map(c=>`<div class="card listcard"><div><h3>${S(c.name)}</h3><p>${c.nodes.length} blocks · ${c.links.length} connections · Updated ${formattedDate(c.updated)}</p>${c.description?`<p style="margin-top:5px">${S(c.description)}</p>`:''}</div><div class="buttons"><button class="btn ${isTemplate?'ghost':''} sm" data-open-chain="${S(c.id)}" data-template="${isTemplate}">${ico(isTemplate?'copy':'edit')} ${isTemplate?'Use Template':'Open'}</button><button class="btn ghost sm" data-export-chain="${S(c.id)}" data-template="${isTemplate}">${ico('download')} Export</button><button class="btn subtle sm" data-duplicate-chain="${S(c.id)}" data-template="${isTemplate}">${ico('copy')}</button><button class="btn subtle sm" data-delete-chain="${S(c.id)}" data-template="${isTemplate}">${ico('trash')}</button></div></div>`).join('')}</div>`}
function newChain(source){const c=source?cloneChain(source):makeChain();state.chains.push(c);activeChainId=c.id;page='chains';editorTab='results';pickerOpen=false;selectedNode=null;persist();render();toast(source?'Template loaded into a new supply chain.':'New blank supply chain created.')}
function cloneChain(original){const c=structuredClone(original),oldNodes=c.nodes||[],lookup=new Map();c.id=id();c.updated=Date.now();c.nodes=oldNodes.map(nd=>{const newid=id();lookup.set(nd.id,newid);return {...nd,id:newid}});c.links=(c.links||[]).map(l=>({...l,id:id(),from:lookup.get(l.from),to:lookup.get(l.to)})).filter(l=>l.from&&l.to);return c}
function activeChain(){return state.chains.find(c=>c.id===activeChainId)}

function goChain(cId){if(!getRef('chains',cId))return;page='chains';activeChainId=cId;selectedNode=null;pendingOut=null;pickerOpen=false;editorTab='results';render()}
function addNode(kind,cId=''){const c=activeChain();if(!c)return;let x=30+c.nodes.length%4*255,y=125+Math.floor(c.nodes.length/4)*205;const co=kind==='company'?getRef('companies',cId):null;if(kind==='company'&&!co){toast('That saved company is no longer available.',true);return}const node={id:id(),kind,companyId:co?.id||'',snapshot:co?structuredClone(co):null,linked:!!co,label:kind==='market'?'Market':kind==='storage'?'Storage':'',note:'',overrideLevel:'',x:Math.min(1195,x),y:Math.min(650,y)};c.nodes.push(node);selectedNode=node.id;pickerOpen=false;pickerSearch='';touchChain();renderWorkspace();toast(kind==='company'?'Saved company block added.':'Utility block added.')}

function renderNode(n){const co=getNodeCompany(n);return `<div class="node ${selectedNode===n.id?'selected':''}" data-node="${S(n.id)}" style="left:${Number(n.x)||0}px;top:${Number(n.y)||0}px"><div class="node-head" data-drag="${S(n.id)}">${nodeIcon(n)}<div style="min-width:0;flex:1"><b>${S(nodeLabel(n))}</b><small>${S(co?fullType(co):(n.kind==='market'?'Sales destination':'Inventory / buffer'))}</small></div></div><div class="node-tag">${co?`${n.linked?'Linked':'Independent'} · ${S(regionLabel(co.regionId))}`:'Storage and market flow block'}</div><div class="node-bar"><button class="port ${pendingOut===n.id?'active':''}" data-port-out="${S(n.id)}">OUT →</button><button class="port" data-port-in="${S(n.id)}">→ IN</button><button class="port" data-select-node="${S(n.id)}" title="Block details">${ico('edit')}</button></div></div>`}
function lineSvg(c){return `<defs><marker id="head-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" stroke="#d5a66e" stroke-width="1.8" fill="none"/></marker></defs>`+c.links.map(l=>{const a=c.nodes.find(x=>x.id===l.from),b=c.nodes.find(x=>x.id===l.to);if(!a||!b)return '';const x1=a.x+225,y1=a.y+68,x2=b.x,y2=b.y+68,dx=Math.max(65,Math.abs(x2-x1)*.5);return `<path d="M${x1} ${y1} C${x1+dx} ${y1},${x2-dx} ${y2},${x2} ${y2}" stroke="#d0a46b" stroke-width="2.6" fill="none" marker-end="url(#head-arrow)"/>`}).join('')}
function pickResults(){const q=pickerSearch.toLowerCase(),arr=state.companies.filter(a=>(a.name+' '+fullType(a)+' '+regionLabel(a.regionId)).toLowerCase().includes(q)&&(!pickerCategory||a.category===pickerCategory));if(!arr.length)return '<p class="mutedline" style="padding:12px">No matching saved companies.</p>';return arr.map(a=>`<button class="pick-item" data-company-pick="${S(a.id)}">${imgBox(a.logo,'building',35)}<span><b>${S(a.name)}</b><small>${S(fullType(a))}</small></span>${ico('plus')}</button>`).join('')}
function renderWorkspaceBase(){const c=activeChain();if(!c){activeChainId=null;renderListChains(false);return}const old=document.getElementById('board-wrap');const scrollX=old?.scrollLeft||0,scrollY=old?.scrollTop||0;const node=c.nodes.find(n=>n.id===selectedNode);main.innerHTML=`<div class="workspace-top"><div class="buttons"><button class="btn subtle" data-act="all-chains">${ico('folder')} All Chains</button><input id="chain-name" class="workspace-name" maxlength="100" value="${S(c.name)}" aria-label="Supply chain name"></div><div class="buttons"><button class="btn ghost sm" data-act="save-chain">${ico('save')} Save</button><button class="btn ghost sm" data-act="save-template">${ico('copy')} Save as Template</button><button class="btn ghost sm" data-act="export-active-chain">${ico('download')} Export JSON</button><button class="btn subtle sm" data-act="toggle-advanced">${ico('settings')} Advanced</button></div></div><div class="workspace"><div class="card work-panel"><h3>${ico('building')} Block Library</h3><p>Choose from your saved companies, or add a generic storage/market block.</p><button class="pick-toggle" data-act="toggle-picker">${ico('search')} Saved Companies ${ico('chevron')}</button>${pickerOpen?`<div class="search" style="margin-bottom:8px">${ico('search')}<input class="field" id="picker-search" placeholder="Search company / product..." value="${S(pickerSearch)}"></div><select id="picker-category" class="field"><option value="">All company categories</option>${Object.keys(PRODUCTS).map(x=>`<option value="${S(x)}" ${pickerCategory===x?'selected':''}>${S(x)}</option>`).join('')}</select><div class="pick-results" id="picker-results">${pickResults()}</div>`:''}<div class="hr"></div><div class="fields-group"><button class="btn ghost" data-add-utility="storage">${ico('box')} Add storage block</button><button class="btn ghost" data-add-utility="market">${ico('coins')} Add market block</button></div><div class="hr"></div><p class="mutedline">To connect: click <b>OUT →</b> on a source block, then <b>→ IN</b> on its destination. Drag a block by its header to move it.</p>${pendingOut?`<div class="notebox" style="margin-top:12px">Connecting from <b>${S(nodeLabel(c.nodes.find(n=>n.id===pendingOut)||{kind:'storage'}))}</b>. Select an IN port or press Escape.</div>`:''}</div><div class="board-wrap" id="board-wrap"><div class="board" id="board"><svg class="connection-svg" id="edge-svg" viewBox="0 0 1450 790">${lineSvg(c)}</svg>${c.nodes.map(renderNode).join('')}${c.nodes.length?'':`<div style="position:absolute;left:275px;top:265px;text-align:center;width:700px;max-width:700px;pointer-events:none;color:#a9979d">${ico('workflow','xl')}<h2 style="color:#d9c6b6;margin:12px 0 7px">Your canvas is empty</h2><p>Search your saved companies on the left and add blocks to start.</p></div>`}</div></div><div class="card work-panel"><div class="page-tabs"><button data-editor-tab="details" class="${editorTab==='details'?'active':''}">Details</button><button data-editor-tab="advanced" class="${editorTab==='advanced'?'active':''}">Advanced</button></div>${editorTab==='advanced'?renderAdvanced(c):renderInspector(c,node)}</div></div><div class="buttons" style="margin-top:13px"><span class="mutedline">${c.nodes.length} blocks · ${c.links.length} connections · Saved locally · Calculation engine enabled</span></div>`;
const wrap=document.getElementById('board-wrap');if(wrap){wrap.scrollLeft=scrollX;wrap.scrollTop=scrollY} if(!c.settings.grid)document.getElementById('board').style.backgroundImage='none'}
function renderInspector(c,n){if(!n)return `<h3>Workspace details</h3><p style="margin-top:7px">Select a block to inspect and edit its scenario-specific settings, or open Advanced for settings affecting this chain.</p><div class="hr"></div><div class="right-entry"><label>Chain description</label><textarea class="field" data-chain-description placeholder="Optional notes">${S(c.description||'')}</textarea></div><h3 style="margin-top:20px">Connections</h3>${c.links.length?c.links.map(l=>{const a=c.nodes.find(n=>n.id===l.from),b=c.nodes.find(n=>n.id===l.to);return `<div class="right-entry"><details class="acc"><summary>${S(nodeLabel(a||{kind:'storage'}))} → ${S(nodeLabel(b||{kind:'storage'}))}</summary><div class="inside"><label class="field-label">Resource on this connection</label><input class="field" data-link-prop="${S(l.id)}|resource" placeholder="e.g. Raw Iron" value="${S(l.resource||'')}"><label class="field-label">Allocation method</label><select class="field" data-link-prop="${S(l.id)}|allocationMode"><option value="">Not configured</option><option value="percent" ${l.allocationMode==='percent'?'selected':''}>Percent</option><option value="units" ${l.allocationMode==='units'?'selected':''}>Fixed units</option><option value="priority" ${l.allocationMode==='priority'?'selected':''}>Priority</option></select><label class="field-label">Allocation (optional)</label><input class="field" data-link-prop="${S(l.id)}|allocationValue" placeholder="Not set" value="${S(l.allocationValue||'')}"><label class="field-label">Notes</label><textarea class="field" data-link-prop="${S(l.id)}|notes">${S(l.notes||'')}</textarea><button class="btn subtle sm" data-remove-link="${S(l.id)}">Remove connection</button></div></details></div>`}).join(''):'<p style="margin-top:8px">No connections yet.</p>'}`;
const co=getNodeCompany(n);return `<div class="buttons" style="justify-content:space-between"><h3>Block details</h3><button class="btn subtle sm" data-remove-node="${S(n.id)}">${ico('trash')} Remove</button></div><div class="hr"></div>${co?`<h3 style="margin-bottom:5px">${S(co.name)}</h3><p>${S(fullType(co))}</p><div class="meta"><span class="chip ${n.linked?'good':'dim'}">${n.linked?'Linked to saved company':'Independent copy'}</span></div><div class="right-entry"><label>Region / current country</label><strong>${S(regionLabel(co.regionId))}</strong><span>${S(countryLabel(effectiveChainCountry(c,co)))}</span></div><div class="right-entry"><label>Saved company level</label><strong>${asNum(co.level)}</strong></div><div class="right-entry"><label>Hypothetical level (optional override)</label><input class="field" type="number" step="any" data-node-prop="overrideLevel" value="${S(n.overrideLevel||'')}" placeholder="No override"></div><button class="btn ghost" data-act="toggle-linked" style="width:100%;margin:12px 0">${n.linked?'Detach as independent copy':'Relink saved company'}</button>`:`<div class="right-entry"><label>Block name</label><input class="field" data-node-prop="label" value="${S(n.label||'')}"></div>`}<div class="right-entry"><label>Scenario notes</label><textarea class="field" data-node-prop="note" placeholder="Optional notes for this block">${S(n.note||'')}</textarea></div><div class="notebox" style="margin-top:12px">Edits in this panel affect the current chain only. Saved company data is not changed.</div>`}
function advancedInput(label,fieldName,c,placeholder='Not set',sel=null){const val=c.settings[fieldName]??'';return `<div><label class="field-label">${S(label)}</label>${sel?`<select class="field" data-advanced="${S(fieldName)}"><option value="">Not set</option>${sel.map(([k,v])=>`<option value="${S(k)}" ${String(val)===k?'selected':''}>${S(v)}</option>`).join('')}</select>`:`<input class="field" data-advanced="${S(fieldName)}" value="${S(val)}" placeholder="${S(placeholder)}">`}</div>`}
function renderAdvanced(c){return `<h3>Advanced Settings</h3><p style="margin:7px 0 13px">Saved for this chain only. These settings customize this chain's calculations and visual layout.</p><div class="details-scroll"><details class="acc" open><summary>General</summary><div class="inside">${advancedInput('Simulation view','simulationMode',c,'', [['simple','Simple'],['advanced','Advanced']])}${advancedInput('Planning period','period',c,'e.g. 1 day')}${advancedInput('Notes','notes',c,'Scenario notes')}</div></details><details class="acc"><summary>Production & Simulation</summary><div class="inside">${advancedInput('Production / work horizon','futureLevel',c,'Planned level or scenario')}${advancedInput('Shift period / cadence','period',c,'Not set')}</div></details><details class="acc"><summary>Resource Distribution</summary><div class="inside">${advancedInput('Allocation priority','resourcePriority',c,'', [['balanced','Balanced'],['first','First connection priority'],['manual','Manual allocation']])}${advancedInput('Stockpile reserve','stockReserve',c,'Not set')}</div></details><details class="acc"><summary>Financial Settings</summary><div class="inside">${advancedInput('Market setting','market',c,'Local / Global / Other')}${advancedInput('Gold-to-dollar rate','exchangeRate',c,'Not set')}${advancedInput('Tax override / scenario notes','taxOverride',c,'Not set')}</div></details><details class="acc"><summary>Region ownership scenarios</summary><div class="inside"><p>Temporarily simulate a region changing countries in this chain only. Saved region ownership stays unchanged.</p>${[...new Set(c.nodes.map(n=>getNodeCompany(n)?.regionId).filter(Boolean))].map(rid=>{const region=getRef('regions',rid);return `<div><label class="field-label">${S(region?.name||'Unknown region')} (current: ${S(countryLabel(region?.countryId))})</label><select class="field" data-region-override="${S(rid)}"><option value="">Use saved controlling country</option>${countryOptions().map(x=>`<option value="${S(x.value)}" ${c.settings.regionOverrides?.[rid]===x.value?'selected':''}>${S(x.label)}</option>`).join('')}</select></div>`}).join('')||'<p>No saved regions are used by the current chain.</p>'}</div></details><details class="acc"><summary>Workers & Energy</summary><div class="inside"><p class="mutedline">Work energy per simulated shift is determined automatically from each worker’s character level, subject to the game's work-action limit. No employee energy allocation is required.</p></div></details><details class="acc"><summary>Forecasting</summary><div class="inside"><p>Use Run simulation to project a configured set of shifts and sales. Detailed recurring schedules and automatic market forecasting are not yet modeled.</p></div></details><details class="acc"><summary>Canvas Appearance</summary><div class="inside"><label class="checkline"><input type="checkbox" data-advanced-check="grid" ${c.settings.grid?'checked':''}> Show grid</label><label class="checkline"><input type="checkbox" data-advanced-check="snap" ${c.settings.snap?'checked':''}> Snap dragged blocks to grid</label><label class="checkline"><input type="checkbox" data-advanced-check="compact" ${c.settings.compact?'checked':''}> Compact blocks (future)</label></div></details></div><div class="buttons" style="margin-top:12px"><button class="btn ghost sm" data-act="save-chain">${ico('save')} Save settings</button></div>`}
function cycleWouldForm(c,source,dest){const edges=new Map();for(const l of [...c.links,{from:source,to:dest}]){if(!edges.has(l.from))edges.set(l.from,[]);edges.get(l.from).push(l.to)}const seen=new Set(),stack=new Set();function visit(a){if(stack.has(a))return true;if(seen.has(a))return false;seen.add(a);stack.add(a);for(const b of edges.get(a)||[])if(visit(b))return true;stack.delete(a);return false}return c.nodes.some(n=>visit(n.id))}
function exportFile(value,filename){const blob=new Blob([JSON.stringify(value,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename.replace(/[\\/:*?"<>|]+/g,'_');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
function packageChain(c,kind){const data=structuredClone(c);data.nodes.forEach(n=>{if(n.kind==='company'&&n.linked){const co=getRef('companies',n.companyId);if(co){n.snapshot=structuredClone(co);n.snapshot.embeddedLibraryWorkers=(co.workerIds||[]).map(wid=>getRef('workers',wid)).filter(Boolean).map(w=>structuredClone(w));n.snapshot.embeddedRegion=getRef('regions',co.regionId)?structuredClone(getRef('regions',co.regionId)):null;n.snapshot.embeddedCountry=co.regionId?(getRef('countries',getRef('regions',co.regionId)?.countryId)?structuredClone(getRef('countries',getRef('regions',co.regionId)?.countryId)):null):(getRef('countries',co.directCountryId)?structuredClone(getRef('countries',co.directCountryId)):null)}}});return {format:'jollyjacks-chain-v1',kind,chain:data}}
function exportChain(id,isTemplate){const c=getRef(isTemplate?'templates':'chains',id);if(!c)return;exportFile(packageChain(c,isTemplate?'template':'chain'),c.name+'.json');toast((isTemplate?'Template':'Supply chain')+' exported.')}
function validateImport(raw){if(!raw||!['jollyjacks-chain-v1','jollyjacks-chain-v2'].includes(raw.format)||!raw.chain)throw Error('Only compatible toolkit chain/template JSON is supported.');const c=raw.chain;if(!Array.isArray(c.nodes)||!Array.isArray(c.links)||c.nodes.length>250||c.links.length>500||typeof c.name!=='string')throw Error('Invalid chain structure.');const nodeIds=new Map();const out=makeChain((c.name||'Imported supply chain').slice(0,100));out.description=String(c.description||'').slice(0,4000);out.settings={...out.settings,...Object.fromEntries(Object.entries(c.settings||{}).filter(([k])=>Object.hasOwn(out.settings,k)))};out.nodes=c.nodes.map(n=>{const k=id();nodeIds.set(n.id,k);const kind=['company','storage','market'].includes(n.kind)?n.kind:'storage';const existing=kind==='company'?getRef('companies',n.companyId):null;const snap=kind==='company'&&n.snapshot&&typeof n.snapshot==='object'?structuredClone(n.snapshot):null;return {id:k,kind,companyId:existing?.id||'',snapshot:existing?structuredClone(existing):snap,linked:!!existing,label:String(n.label||'').slice(0,100),note:String(n.note||'').slice(0,600),overrideLevel:String(n.overrideLevel||'').slice(0,30),shiftCount:String(n.shiftCount||'').slice(0,10),workerShifts:n.workerShifts&&typeof n.workerShifts==='object'?Object.fromEntries(Object.entries(n.workerShifts).filter(([k,v])=>typeof k==='string'&&Number.isFinite(Number(v))&&Number(v)>=0).slice(0,100)): {},venue:['global','local'].includes(n.venue)?n.venue:'',exporterCountryId:String(n.exporterCountryId||'').slice(0,100),prices:String(n.prices||'').slice(0,12000),initialStock:String(n.initialStock||'').slice(0,12000),x:Math.max(0,Math.min(1190,Number(n.x)||0)),y:Math.max(0,Math.min(650,Number(n.y)||0))}});out.links=c.links.map(l=>({id:id(),from:nodeIds.get(l.from),to:nodeIds.get(l.to),resource:String(l.resource||'').slice(0,100),allocationMode:['percent','units','priority'].includes(l.allocationMode)?l.allocationMode:'',allocationValue:String(l.allocationValue||'').slice(0,100),priority:String(l.priority||'').slice(0,100),notes:String(l.notes||'').slice(0,600)})).filter(l=>l.from&&l.to&&l.from!==l.to);return out}
async function importChainFile(file,asTemplate){if(!file)return;if(file.size>12*1024*1024){toast('Please import a JSON file under 12 MB.',true);return}try{const raw=JSON.parse(await file.text());const c=validateImport(raw);state[asTemplate?'templates':'chains'].push(c);persist();if(asTemplate){page='templates';render();toast('Template imported successfully.')}else{activeChainId=c.id;page='chains';selectedNode=null;editorTab='details';render();toast('Supply chain imported successfully.')}}catch(e){toast('Import failed: '+e.message,true)}}
function renderSettingsBase(){main.innerHTML=pagehead('Settings & Data','Customize your offline toolkit, back up records, or clear all local data.')+`<div class="grid two"><div class="card pad"><h2>Application branding</h2><div class="logoedit" style="margin:14px 0"><img class="itemlogo" style="width:90px;height:90px" src="${BRAND}" alt="Gilded Smoke avatar"><div><h3>JollyJack's Gilded Smoke</h3><p>The toolkit's icon and theme. Company logos are never preassigned.</p></div></div><span class="chip">Dark crimson & gold</span></div><div class="card pad"><h2>Local data overview</h2><p style="margin:10px 0">All user data is kept inside this browser using local storage. No online account or sync is used.</p><div class="grid two">${[['Countries',state.countries.length],['Regions',state.regions.length],['Companies',state.companies.length],['Workers',state.workers.length],['Supply chains',state.chains.length],['Templates',state.templates.length]].map(([k,n])=>`<div class="subcard"><small>${k}</small><h2>${n}</h2></div>`).join('')}</div></div><div class="card pad"><h2>Backup & restore</h2><p style="margin:10px 0 15px">Export everything, including personal images, company records, regions, workers and saved chains. Importing a full backup replaces the data in this browser.</p><div class="buttons"><button class="btn" data-act="export-backup">${ico('download')} Export all data</button><button class="btn ghost" data-act="import-backup">${ico('upload')} Import backup</button></div></div><div class="card pad"><h2>Clear toolkit data</h2><p style="margin:10px 0 15px">Return to a completely blank first-launch state, without example profiles, nations or companies. This cannot be undone without a backup.</p><button class="btn bad" data-act="reset-all">${ico('trash')} Reset everything</button></div></div><div class="notebox" style="margin-top:15px">V1.1 includes offline mathematical estimates but has no connection to the live Parlamentum game or automatic market prices.</div>`}
